# Builds rlex.exe on GitHub's Windows runners, and releases it.
#
# Two ways to release, both from main:
#   - Run this workflow (Actions → Windows build → Run workflow) and pick patch, minor or
#     major, or type an exact version. It writes the version into Cargo.toml and Cargo.lock,
#     builds and tests, commits "Release vX" to main, then tags that commit and publishes.
#   - Push a new version in Cargo.toml to main. Pushes that touch Cargo.toml without a new
#     version (adding a dependency, say) skip, because the version's tag already exists.
#
# A version with a suffix (0.3.0-beta.1) or the "pre-release" box makes a pre-release;
# anything else is a full release and becomes /releases/latest.
#
# Pull requests that touch the build, and runs started on any branch but main, build and
# test the same way and upload the exe to the run page, without publishing anything.
name: Windows build

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  pull_request:
    paths:
      - .github/workflows/windows-release.yml
      - scripts/release-version.sh
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump Cargo.toml's version by"
        type: choice
        default: patch
        options: [patch, minor, major]
      version:
        description: "Or release this exact version instead (e.g. 1.0.0-beta.1)"
        type: string
        required: false
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false

# One release at a time; pull request runs replace their own older runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'windows-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      stamp: ${{ steps.plan.outputs.stamp }}
      release: ${{ steps.plan.outputs.release }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - id: plan
        name: Decide what this run does
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          current=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          tag_exists() { git ls-remote --exit-code --tags origin "refs/tags/v$1" >/dev/null; }

          build=true stamp=false release=false
          case $EVENT in
            pull_request)
              version=$current
              ;;
            push)
              version=$current
              if tag_exists "$version"; then
                build=false
                echo "Cargo.toml changed, but v$version is already released. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
              else
                release=true
              fi
              ;;
            workflow_dispatch)
              version=$(scripts/release-version.sh "$current" "$BUMP" "$EXACT")
              if tag_exists "$version"; then
                echo "::error::v$version is already released. Is Cargo.toml's version ($current) behind the latest release?"
                exit 1
              fi
              [[ $version == "$current" ]] || stamp=true
              if [[ $REF == refs/heads/main ]]; then
                release=true
              else
                echo "Started on ${REF#refs/heads/}, not main: builds v$version without publishing it." >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
          esac

          prerelease=false
          if [[ $version == *-* || $PRERELEASE == true ]]; then prerelease=true; fi

          if [[ $release == true ]]; then
            kind=$([[ $prerelease == true ]] && echo "pre-release" || echo "full release")
            echo "Releasing **v$version** as a $kind (Cargo.toml had $current)." >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "version=$version"
            echo "build=$build"
            echo "stamp=$stamp"
            echo "release=$release"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.stamp == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Write the version into Cargo.toml and Cargo.lock
        if: steps.plan.outputs.stamp == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
          # Rewrites only Rlex's own entry in Cargo.lock; dependencies stay as they are.
          cargo update --workspace
          git diff --stat

      - if: steps.plan.outputs.stamp == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            Cargo.toml
            Cargo.lock

  build:
    name: Test and build
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - if: needs.plan.outputs.stamp == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --release shares its compiled dependencies with the build below.
      - name: Test
        shell: bash
        run: cargo test --release --locked

      - name: Build
        shell: bash
        env:
          # Optional repo secret; without it the exe has no built-in OMDb key.
          RLEX_OMDB_KEY: ${{ secrets.RLEX_OMDB_KEY }}
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp target/release/rlex.exe dist/rlex-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: rlex-windows-x64
          path: dist/rlex-windows-x64.exe

  release:
    name: Publish
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - if: needs.plan.outputs.stamp == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      # A version bump reverted on main while this run built shouldn't still ship. (The
      # button's own push below already fails if main moved.)
      - name: Check main still has this version
        if: needs.plan.outputs.stamp != 'true'
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git fetch --depth=1 origin main
          on_main=$(git show FETCH_HEAD:Cargo.toml | sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"$/\1/p')
          if [[ $on_main != "$VERSION" ]]; then
            echo "::error::main's Cargo.toml now says $on_main, not $VERSION. Not publishing v$VERSION."
            exit 1
          fi

      # Commits first, so the tag lands on a commit whose Cargo.toml says the same version.
      # If main moved on since the run started, the push fails and nothing is published.
      # Pushes made with this run's token don't start workflows, so this commit can't
      # trigger another release.
      - id: commit
        name: Commit the version to main
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if ! git diff --quiet -- Cargo.toml Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Release v$VERSION" -- Cargo.toml Cargo.lock
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: rlex-windows-x64
          path: dist

      - name: Tag and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          TARGET: ${{ steps.commit.outputs.sha }}
        run: |
          flags=()
          [[ $PRERELEASE == true ]] && flags+=(--prerelease)
          gh release create "v$VERSION" dist/rlex-windows-x64.exe \
            --target "$TARGET" --title "Rlex v$VERSION" --generate-notes "${flags[@]}"
          echo "Published https://github.com/${{ github.repository }}/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"
