[package]
name = "rlex"
version = "0.1.0"
edition = "2024"
description = "A lean media center: your folders, Stremio addons and torrent streaming, in Rune."
publish = false

[dependencies]
anyhow = "1"
dirs = "6"
env_logger = "0.11"
futures = "0.3"
# Decodes and resizes artwork to the size it's drawn at, on the Tokio blocking pool.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
librqbit = { version = "9.0.1", default-features = false, features = ["http-api", "rust-tls", "tracing-subscriber-utils"] }
# The listener type librqbit's streaming server takes. `http-api` only compiles
# with `tracing-subscriber-utils` (librqbit 9.0.1).
librqbit-dualstack-sockets = "0.7"
log = "0.4"
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
# Rune is pre-release: pin a rev of its `dev` branch, which is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "8ee30954add065098f043335ece9d9ea0914d21d", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "8ee30954add065098f043335ece9d9ea0914d21d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "process", "time", "sync", "macros"] }
url = "2"
urlencoding = "2"
walkdir = "2"
zbus = { version = "5", default-features = false, features = ["async-io"] }

[profile.dev]
debug = "limited"
# Rune's runtime is generic over the app's state, so most of its per-frame work is compiled
# in this crate: unoptimized, scrolling misses frames on a fast display.
opt-level = 1

# Rune's layout, text and renderer, and the image decoders, are slow unoptimized; build
# every dependency optimized so the dev app stays responsive. Only Rlex itself is debug.
# Rune's debug-build checks (its perf and live-value warnings) cost a few milliseconds a
# frame, more than a 240 Hz display allows, so dependencies build without them.
[profile.dev.package."*"]
opt-level = 2
debug = false
debug-assertions = false

[profile.release]
strip = "symbols"
