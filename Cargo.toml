[package]
name = "rlex"
version = "0.1.0"
edition = "2024"
description = "A lean media center: your folders, Stremio addons and torrent streaming, in GPUI."
publish = false

[dependencies]
anyhow = "1"
dirs = "6"
env_logger = "0.11"
futures = "0.3"
gpui-kit = "=0.8.1"
# Decodes the window icon; the version GPUI's `WindowOptions::icon` expects.
image = { version = "0.25", default-features = false, features = ["png"] }
librqbit = { version = "9.0.1", default-features = false, features = ["http-api", "rust-tls", "tracing-subscriber-utils"] }
# The listener type librqbit's streaming server takes. `http-api` only compiles
# with `tracing-subscriber-utils` (librqbit 9.0.1).
librqbit-dualstack-sockets = "0.7"
log = "0.4"
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.10" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "process", "time", "sync", "macros"] }
url = "2"
urlencoding = "2"
walkdir = "2"
zbus = { version = "5", default-features = false, features = ["async-io"] }

[profile.dev]
debug = "limited"

# GPUI's layout, text and rendering crates are slow unoptimized; build them at -O3
# even in debug so the dev app stays responsive.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-wgpu = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
image = { opt-level = 3 }

[profile.release]
strip = "symbols"
